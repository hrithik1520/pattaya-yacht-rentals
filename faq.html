<script>
  mountLayout("faq");
  const faqs = [
    ["How do I choose the right boat?", "Start with the number of guests and the facilities you need. We can then compare suitable boats by layout, trip duration and budget."],
    ["Are prices per person or per boat?", "Your quote will state the pricing basis for the selected charter and list any per-person charges separately."],
    ["Are the prices on the site final?", "A displayed rate is valid only for the conditions shown. We confirm your date, route, inclusions, applicable fees and total in a written quote."],
    ["Does sending an enquiry reserve the yacht?", "No. We must confirm availability and payment terms before a booking is secured."],
    ["Where do charters depart?", "Departure depends on the yacht. The exact marina or pier and arrival instructions will be stated in your confirmation."],
    ["Can we choose the route?", "Share your preferred destination. We will check it against charter hours, vessel capability, local access and conditions before confirming an itinerary."],
    ["Can we bring food or drinks?", "Rules differ by boat. Ask us before purchasing supplies; your quote will state what is allowed and what catering is available."],
    ["What happens in bad weather?", "The captain/operator makes the safety decision. Your booking confirmation will contain the applicable rescheduling or refund terms."],
    ["How much deposit is required?", "The deposit and balance dates depend on the confirmed booking terms and will be shown in your quote."],
    ["Can children come aboard?", "Many trips can suit families, but age rules, life jackets and supervision requirements vary. Tell us children's ages so we can check the specific boat."],
    ["Can we arrange a birthday or corporate event?", "Yes, where a suitable vessel and services are available. Send the guest count and your event brief so we can prepare options."],
    ["What if our guest count changes?", "Tell us as soon as possible. The boat's licensed capacity cannot be exceeded and any effect on the price or services will be confirmed in writing."],
  ];
  const list = document.getElementById("faqList");
  faqs.forEach(([q,a]) => {
    list.innerHTML += `<details class="card p-5"><summary class="font-semibold flex justify-between">${q}<span class="chev">&#9662;</span></summary><p class="text-sm text-navy/70 mt-2">${a}</p></details>`;
  });
</script>
